# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Inventory PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  labels:
    app: inventory-db
spec:
  type: ClusterIP
  selector:
    app: inventory-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
