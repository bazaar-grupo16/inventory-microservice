# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Inventory Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      labels:
        app: inventory-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: inventory-service
          image: $IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8000
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: CATALOG_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: CATALOG_SERVICE_URL
            - name: NOTIFICATIONS_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: NOTIFICATIONS_SERVICE_URL
            - name: LOW_STOCK_THRESHOLD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: LOW_STOCK_THRESHOLD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: DB_NAME
            - name: CLEANUP_INTERVAL_SECONDS
              value: "60"
            - name: RESERVATION_TTL_MINUTES
              value: "32"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: inventory-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.cluster.name=bazaar-dev"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
