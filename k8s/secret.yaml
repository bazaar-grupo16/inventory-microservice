# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Inventory PostgreSQL Database
# ──────────────────────────────────────────────────────────────
# Complete secrets in GitHub repository secrets
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-credentials
type: Opaque
stringData:
  CATALOG_SERVICE_URL: $CATALOG_SERVICE_URL
  DB_HOST: inventory-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
