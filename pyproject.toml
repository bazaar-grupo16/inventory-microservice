[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html:coverage_html"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/core/*",
    "src/api/health.py",
    "src/main.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]